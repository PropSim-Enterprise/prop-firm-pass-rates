name: Update dataset

# The PropSim Prop Trading Index publishes on Mondays around 06:00 UTC. This
# runs a few hours later, fetches the public feed and commits any new week.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No new data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Data: week of $(node -p "require('./data/prop-trading-index.json').updated")"
          git push
